<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fridge GPT</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Fridge GPT</h1>

      <label>
        API URL
        <input id="apiUrl" type="url" autocomplete="off" spellcheck="false">
      </label>

      <label>
        Bearer token
        <input id="token" type="password" autocomplete="off" spellcheck="false">
      </label>

      <label>
        Delivery date
        <input id="deliveryDate" type="date">
      </label>

      <button id="saveButton" type="button">Save checkout</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
